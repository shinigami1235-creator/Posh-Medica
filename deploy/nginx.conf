# Example nginx server block. Apache needs nothing extra: public/.htaccess is included.
server {
    listen 443 ssl http2;
    server_name www.poshmedica.co.th;
    root /var/www/poshmedica/public;
    index index.php;
    client_max_body_size 20M;          # admin photo uploads and contact form files

    ssl_certificate     /etc/ssl/poshmedica/fullchain.pem;
    ssl_certificate_key /etc/ssl/poshmedica/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # the theme and uploads change rarely: cache them for a year (theme files carry ?v= so edits still show)
    location ~* ^/(themes|storage|css|js|fonts)/.*\.(css|js|woff2|webp|png|jpe?g|svg|gif|pdf)$ { expires 1y; add_header Cache-Control "public"; try_files $uri =404; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location ~ /\.(?!well-known) { deny all; }
}
server { listen 80; server_name poshmedica.co.th www.poshmedica.co.th; return 301 https://www.poshmedica.co.th$request_uri; }
server { listen 443 ssl; server_name poshmedica.co.th; ssl_certificate /etc/ssl/poshmedica/fullchain.pem; ssl_certificate_key /etc/ssl/poshmedica/privkey.pem; return 301 https://www.poshmedica.co.th$request_uri; }
